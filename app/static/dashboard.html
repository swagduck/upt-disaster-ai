<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPT Analytics Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="logo">
      <a href="/">← RETURN TO GLOBE</a>
    </div>
    <div class="title">
      <h1>[ UPT ] GLOBAL DISASTER ANALYTICS</h1>
    </div>
    <div class="status">
      SYSTEM STATUS: <span class="online">ONLINE</span>
    </div>
  </header>

  <!-- Main Grid -->
  <main class="dashboard-grid">
    
    <!-- Summary Cards -->
    <section class="card summary-card" id="card-total">
      <div class="card-header">TOTAL SNAPSHOTS</div>
      <div class="card-value" id="val-total-snapshots">--</div>
    </section>

    <section class="card summary-card" id="card-events">
      <div class="card-header">EVENTS RECORDED</div>
      <div class="card-value" id="val-total-events">--</div>
    </section>

    <section class="card summary-card" id="card-max-mag">
      <div class="card-header">MAX MAGNITUDE (ALL TIME)</div>
      <div class="card-value" id="val-max-mag">--</div>
    </section>

    <section class="card summary-card" id="card-24h">
      <div class="card-header">SNAPSHOTS (LAST 24H)</div>
      <div class="card-value" id="val-24h">--</div>
    </section>

    <!-- Main Trend Chart -->
    <section class="card chart-card trend-chart">
      <div class="card-header">GLOBAL EVENT TREND (LAST 24H)</div>
      <div class="chart-container">
        <canvas id="trendChart"></canvas>
      </div>
    </section>

    <!-- Hazard Distribution Chart -->
    <section class="card chart-card distribution-chart">
      <div class="card-header">HAZARD DISTRIBUTION</div>
      <div class="chart-container">
        <canvas id="distChart"></canvas>
      </div>
    </section>

    <!-- Magnitude Trend Chart -->
    <section class="card chart-card magnitude-chart">
      <div class="card-header">MAX MAGNITUDE TREND</div>
      <div class="chart-container">
        <canvas id="magChart"></canvas>
      </div>
    </section>

  </main>

  <script src="/static/js/dashboard.js"></script>
</body>
</html>
